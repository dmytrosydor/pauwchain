line-length = 120
target-version = "py312"

[lint]
select = ["E", "F", "W", "B"]
ignore = ["E731", "B905"]

[lint.per-file-ignores]
"docs/research/probes/*" = ["E", "F", "B"]  # one-off measurement scripts, kept as is
"scripts/gen_vectors.py" = ["E402"]
"worker/worker.py" = ["E402"]
"worker/server.py" = ["E402"]
"sim/simulator.py" = ["B023"]  # the block_of closure is only called within its own round
